codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 70%
        threshold: 1%
        base: auto
        informational: false

    patch:
      default:
        target: 70%
        threshold: 1%
        base: auto
        informational: false

comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

ignore:
  - "test/**/*"
  - "scripts/**/*"
  - "node_modules/**/*"
  - "coverage/**/*"
  - "*.config.js"
  - "*.config.ts"
